name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Pin Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install (editable + dev extras)
        run: uv venv --python ${{ matrix.python-version }} && uv pip install -e ".[dev]"

      - name: Run tests
        run: uv run pytest -v

  build:
    name: Build wheel + sdist + skill zip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Build wheel + sdist
        run: uv build

      - name: Build Claude.ai Skill zip
        run: uv run python scripts/build_skill_zip.py

      - name: Verify artifacts present
        run: |
          ls -lh dist/
          test -f dist/*.whl
          test -f dist/*.tar.gz
          test -f dist/claude-folder-handler-skill-*.zip

      - name: Upload artifacts (for inspection)
        uses: actions/upload-artifact@v4
        with:
          name: ci-dist
          path: dist/*
          retention-days: 7
